services:
  postgres:
    image: postgres:17-alpine
    container_name: offer-postgres
    restart: unless-stopped

    ports:
      - "127.0.0.1:55433:5432"

    environment:
      POSTGRES_DB: offer_state
      POSTGRES_USER: offer_app
      POSTGRES_PASSWORD: offer_app

    volumes:
      - offer_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offer_app -d offer_state"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  offer_postgres_data:
